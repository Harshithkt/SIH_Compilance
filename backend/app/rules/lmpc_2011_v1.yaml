version: "2011-v1"
title: "Legal Metrology (Packaged Commodities) Rules, 2011"
effective_date: "2011-04-01"
superseded_by: "2022-v2"
rules:
  - id: R6-a-mfg-importer-packer
    clause: "Rule 6(1)(a)"
    title: "Name and address of manufacturer/packer/importer"
    field: manufacturer_details
    check_type: presence
    severity: high
    message: "Name and complete address of the manufacturer, packer, or importer must be declared."

  - id: R6-b-common-name
    clause: "Rule 6(1)(b)"
    title: "Common or generic name of commodity"
    field: common_name
    check_type: presence
    severity: medium
    message: "The common or generic name of the commodity must be declared."

  - id: R6-c-net-quantity
    clause: "Rule 6(1)(c)"
    title: "Net quantity in standard units"
    field: net_quantity
    check_type: regex
    params:
      pattern: '^\s*\d+(\.\d+)?\s?(g|gm|gram|grams|kg|ml|l|litre|litres)\s*$'
      flags: "i"
    severity: high
    message: "Net quantity must be declared in standard metric units (g/kg/ml/l)."

  - id: R6-e-mrp
    clause: "Rule 6(1)(e)"
    title: "Retail sale price (MRP)"
    field: mrp
    check_type: regex
    params:
      pattern: '^\s*(rs\.?|inr|₹)?\s*[\d,]+(\.\d{1,2})?\s*$'
      flags: "i"
    severity: high
    message: "Maximum Retail Price, inclusive of all taxes, must be declared."

  - id: R6-d-mfg-date
    clause: "Rule 6(1)(d)"
    title: "Month and year of manufacture/packing/import"
    field: mfg_date
    check_type: regex
    params:
      pattern: '^\s*(0[1-9]|1[0-2])[\/\-\s](\d{4}|\d{2})\s*$'
      flags: "i"
    severity: high
    message: "Month and year of manufacture, packing, or import must be declared."

  - id: R6-2-consumer-care
    clause: "Rule 6(2)"
    title: "Consumer care / complaint contact"
    field: consumer_care
    check_type: presence
    severity: medium
    message: "Consumer care details (address/phone/email) for complaints must be declared."

  - id: R6-f-dimensions
    clause: "Rule 6(1)(f)"
    title: "Dimensions where relevant"
    field: dimensions
    check_type: presence
    severity: medium
    message: "The dimensions of the commodity must be declared where relevant."
    applies_if:
      field: dimensions_relevant
      equals: true

  - id: R6-g-other-mandatory-matter
    clause: "Rule 6(1)(g)"
    title: "Other declarations required by the rules"
    field: other_mandatory_declarations
    check_type: presence
    severity: medium
    message: "Other declarations required by the rules must be present."
    applies_if:
      field: other_declarations_required
      equals: true

  - id: R10-importer
    clause: "Rule 10(1)"
    title: "Importer name and complete address"
    field: importer_details
    check_type: presence
    severity: high
    message: "Imported packages must declare the name and complete address of the importer."
    applies_if:
      field: is_imported
      equals: true

  - id: R7-numeral-height-mrp
    clause: "Rule 7(2)"
    title: "Minimum numeral height for MRP declaration"
    field: mrp
    check_type: numeral_height_table1
    params:
      base_ratio_per_mm: 0.020
      reference: "Second Schedule Table I bands the minimum numeral height by declared net quantity (1mm up to 200 g/ml, 2mm from 200-500, 4mm above), not one flat figure — this check scales with that band. The threshold itself is a label-height ratio, not a millimetre measurement: 0.020 is calibrated against the 1mm band on a typical field photograph and scaled up per band from there. Without a reference object of known size in frame, no absolute error bound in millimetres can be stated; treat findings near the threshold as a prompt for closer manual inspection, not a precise measurement."
    severity: medium
    message: "MRP numerals do not meet the minimum height mandated for this pack size."

  - id: R8-fssai-license
    clause: "FSS Act 2006, Sec 26 read with LMPC Rule 6(1)(a)"
    title: "FSSAI license number (for food items)"
    field: fssai_license_no
    check_type: regex
    params:
      pattern: '^\d{14}$'
      flags: ""
    severity: high
    message: "FSSAI license number must be a valid 14-digit number, displayed on the package."
    applies_if:
      field: is_food_item
      equals: true

  - id: R18-unit-sale-price-sanity
    clause: "Rule 18 (derived check)"
    title: "MRP-to-net-quantity sanity check"
    field: unit_price_sanity
    check_type: numeric_ratio
    params:
      description: "Flags implausible MRP/quantity ratios for manual review; not a standalone headline feature."
    severity: low
    message: "MRP relative to declared net quantity looks unusual — recommend manual review."
